<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Autos – Vorschau</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Eigenständige Testseite für den Auto-Katalog (per Doppelklick über file:// nutzbar).
    autos_vorschau.html                  alle Autos im Raster, von schräg vorne-links-oben
    autos_vorschau.html?auto=<id>        ein einzelnes Auto groß, dreht sich langsam
    ...&winkel=<grad>                    feste Ansicht statt Drehung (0 = von vorne, 90 = Seite links,
                                         180 = von hinten, -90 = Seite rechts; Standard im Raster: 35)
    ...&hoehe=<grad>                     Kamera-Neigung (Standard 22)
    ...&extra=1                          zusätzlich ein Demo-SUV (kein Katalogauto)
    ...&lenkung=<grad>&rollen=<grad>     Räder einschlagen / drehen (Test der userData)
    ?ansicht=alle4                       je Auto eine Zeile mit 4 Blickwinkeln
                                         (Front-Dreiviertel, Seite, Heck-Dreiviertel, Front)
    ?ansicht=alle4&auto=<id>             nur dieses Auto, 4 große Ansichten nebeneinander
    ...&bremsen=1                        Bremslichter an
    ...&blaulicht=<phase>                Blaulicht (nur Streifenwagen): 0 aus, 1 links, 2 rechts, 3 beide
                                         (&blaulichtFarbe=rot für rot)
  Autos mit waehlbar: false (Streifenwagen) werden mit „(nicht wählbar)" beschriftet.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8ff; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #bild { display: block; width: 100vw; height: 100vh; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap;
           background: rgba(255,255,255,.88); border-radius: 8px; padding: 3px 10px; font-size: 15px; font-weight: 600; color: #123;
           box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .label small { display: block; font-weight: 400; font-size: 12px; color: #456; }
  #info { position: absolute; left: 12px; top: 10px; font-size: 13px; color: #123; background: rgba(255,255,255,.7); padding: 4px 10px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="bild"></canvas>
<div id="labels"></div>
<div id="info"></div>

<script src="../vendor/three.min.js"></script>
<script src="../src/config.js"></script>
<script src="../src/cars/carCatalog.js"></script>
<script src="../src/cars/carBuilder.js"></script>
<script>
(function () {
  const R = window.Rennspiel;
  const q = new URLSearchParams(location.search);
  const einzelId = q.get('auto');
  const rad = (g) => g * Math.PI / 180;


  // ===== Ansicht 'alle4': je Auto 4 Blickwinkel in eigenen Bildausschnitten =====
  if (q.get('ansicht') === 'alle4') {
    const canvas = document.getElementById('bild');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setScissorTest(true);
    const szene = new THREE.Scene();
    szene.add(new THREE.HemisphereLight(0xdfefff, 0x6a7f55, 0.9));
    const sonne = new THREE.DirectionalLight(0xfff3d6, 1.1);
    sonne.position.set(-30, 50, -20);
    szene.add(sonne);
    const boden = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x9db27e }));
    boden.rotation.x = -Math.PI / 2;
    szene.add(boden);
    let liste = R.carCatalog.slice();
    if (einzelId) liste = liste.filter((a) => a.id === einzelId);
    const autos = liste.map((a) => {
      const m = R.carBuilder.bauen(a);
      if (q.get('bremsen')) R.carBuilder.setzeBremslicht(m, true);
      if (q.get('lenkung')) R.carBuilder.lenkeRaeder(m, rad(parseFloat(q.get('lenkung'))));
      if (q.get('blaulicht')) R.carBuilder.setzeBlaulicht(m, parseInt(q.get('blaulicht'), 10), q.get('blaulichtFarbe'));
      m.visible = false; szene.add(m); return { a, m };
    });
    // Azimut: 0 = von vorne, 90 = linke Seite, 180 = von hinten
    const BLICKE = [{ n: 'Front ¾', az: 35, h: 16 }, { n: 'Seite', az: 90, h: 6 }, { n: 'Heck ¾', az: 215, h: 16 }, { n: 'Front', az: 0, h: 8 }];
    const kamera = new THREE.PerspectiveCamera(24, 1, 0.1, 200);
    const labels = document.getElementById('labels');
    function zeichnen() {
      const W = canvas.clientWidth, Hh = canvas.clientHeight;
      renderer.setSize(W, Hh, false);
      const zeilen = autos.length, zw = W / 4, zh = Hh / zeilen;
      labels.innerHTML = '';
      autos.forEach((e, zi) => {
        autos.forEach((x) => { x.m.visible = x === e; });
        BLICKE.forEach((b, si) => {
          const x0 = si * zw, y0 = Hh - (zi + 1) * zh;
          renderer.setViewport(x0, y0, zw, zh);
          renderer.setScissor(x0, y0, zw, zh);
          renderer.setClearColor(0xcfe8ff);
          renderer.clear();
          kamera.aspect = zw / zh;
          const ab = e.a.abmessungen || e.a.fahrwerte;
          const az = rad(b.az), hh = rad(b.h);
          // Abstand so, dass das Auto ~85 % der Ausschnittsbreite füllt
          const ausdehnung = Math.abs(Math.sin(az)) * ab.laenge * 0.5 + Math.abs(Math.cos(az)) * ab.breite * 0.62 + 0.35;
          const dist = Math.max(ausdehnung / (Math.tan(rad(kamera.fov / 2)) * kamera.aspect), 2.2 / Math.tan(rad(kamera.fov / 2)));
          kamera.position.set(-Math.sin(az) * Math.cos(hh) * dist, 0.7 + Math.sin(hh) * dist, -Math.cos(az) * Math.cos(hh) * dist);
          kamera.lookAt(0, 0.62, 0);
          kamera.updateProjectionMatrix();
          renderer.render(szene, kamera);
          if (si === 0) {
            const el = document.createElement('div');
            el.className = 'label';
            el.style.left = '90px'; el.style.top = (zi * zh + 6) + 'px';
            el.innerHTML = e.a.name + (e.a.waehlbar === false ? ' <small>(nicht wählbar)</small>' : '');
            labels.appendChild(el);
          }
        });
      });
    }
    window.addEventListener('resize', zeichnen);
    zeichnen();
    window.vorschau = { eintraege: autos.map((e) => ({ auto: e.m })), renderer, szene, kamera, fertig: true };
    document.getElementById('info').style.display = 'none';
    return;
  }

  // --- Autos wählen ---
  let autos = R.carCatalog.slice();
  if (q.get('extra') === '1') {
    autos.push({ id: 'demo-suv', name: 'Demo-SUV', farbeName: 'Orange', farbe: 0xff7a00, karosserie: 'suv',
      fahrwerte: { laenge: 4.5, breite: 1.88 } });
  }
  if (einzelId) autos = autos.filter((a) => a.id === einzelId);
  if (!autos.length) { document.getElementById('info').textContent = 'Auto nicht gefunden: ' + einzelId; return; }

  // --- Szene ---
  const canvas = document.getElementById('bild');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  const szene = new THREE.Scene();
  szene.background = new THREE.Color(0xcfe8ff);
  szene.add(new THREE.HemisphereLight(0xdfefff, 0x6a7f55, 0.9));
  const sonne = new THREE.DirectionalLight(0xfff3d6, 1.1);
  sonne.position.set(-30, 50, -20);
  szene.add(sonne);
  const boden = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x8aa06c }));
  boden.rotation.x = -Math.PI / 2;
  szene.add(boden);

  // --- Anordnung ---
  const winkelParam = q.get('winkel');
  const dreht = !!einzelId && winkelParam === null;
  const grundWinkel = winkelParam !== null ? parseFloat(winkelParam) : 35;   // Kamera-Azimut um das Auto
  const spalten = einzelId ? 1 : Math.min(4, autos.length);
  const zeilen = Math.ceil(autos.length / spalten);
  const abstandX = 6.6, abstandZ = 8;
  const eintraege = autos.map((a, i) => {
    const auto = R.carBuilder.bauen(a);
    const sx = i % spalten, sz = Math.floor(i / spalten);
    auto.position.set((sx - (spalten - 1) / 2) * abstandX, 0, (sz - (zeilen - 1) / 2) * abstandZ);
    szene.add(auto);
    if (q.get('lenkung')) R.carBuilder.lenkeRaeder(auto, rad(parseFloat(q.get('lenkung'))));
    if (q.get('rollen')) R.carBuilder.dreheRaeder(auto, rad(parseFloat(q.get('rollen'))));
    if (q.get('bremsen')) R.carBuilder.setzeBremslicht(auto, true);
    if (q.get('blaulicht')) R.carBuilder.setzeBlaulicht(auto, parseInt(q.get('blaulicht'), 10), q.get('blaulichtFarbe'));
    const el = document.createElement('div');
    el.className = 'label';
    el.innerHTML = a.name + '<small>' + (a.farbeName || '') + ' · ' + a.karosserie + (a.waehlbar === false ? ' · nicht wählbar' : '') + '</small>';
    document.getElementById('labels').appendChild(el);
    return { auto, el };
  });

  // Kamera: fest bei +z oben; die Autos werden um y gedreht, so dass die Kamera
  // sie aus dem Azimut "winkel" sieht (0 = von vorne, positiv = von vorne-links).
  const kamera = new THREE.PerspectiveCamera(einzelId ? 30 : 32, 1, 0.1, 500);
  const neigung = rad(parseFloat(q.get('hoehe') || (einzelId ? 18 : 24)));
  function kameraSetzen() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    kamera.aspect = w / h;
    // Abstand so wählen, dass das Raster ins Bild passt
    const breite = spalten * abstandX + 1, tiefe = zeilen * abstandZ + 1;
    const halbHoehe = einzelId ? 3.2 : Math.max(tiefe * 0.5 * Math.sin(neigung) + 2.5, breite * 0.5 / kamera.aspect);
    const dist = einzelId ? 10.5 : halbHoehe / Math.tan(rad(kamera.fov / 2)) * 1.25;
    kamera.position.set(0, Math.sin(neigung) * dist, Math.cos(neigung) * dist);
    kamera.lookAt(0, einzelId ? 0.7 : 0, 0);
    kamera.updateProjectionMatrix();
  }
  window.addEventListener('resize', kameraSetzen);
  kameraSetzen();

  const v = new THREE.Vector3();
  function zeichnen(t) {
    const az = dreht ? (t / 1000) * 25 : grundWinkel;      // Grad
    eintraege.forEach((e) => { e.auto.rotation.y = Math.PI - rad(az); });
    if (q.get('nah') && eintraege.length) {   // Nahbild: linkes Vorderrad von außen, leicht von vorn
      const a = eintraege[0].auto; a.updateMatrixWorld(true);
      const re = q.get('nah') === 'r', rad0 = a.userData.vorderraeder[re ? 1 : 0], c = new THREE.Vector3(); rad0.getWorldPosition(c);
      const aussen = new THREE.Vector3(re ? 1 : -1, 0, 0).applyQuaternion(a.quaternion);
      const vorn = new THREE.Vector3(0, 0, -1).applyQuaternion(a.quaternion);
      kamera.fov = 28; kamera.updateProjectionMatrix();
      kamera.position.copy(c).addScaledVector(aussen, 1.5).addScaledVector(vorn, 0.55); kamera.position.y += 0.35;
      kamera.lookAt(c);
    }
    renderer.render(szene, kamera);      // aktualisiert auch die Kamera-Matrizen für project()
    eintraege.forEach((e) => {
      // Label unter dem Auto
      v.copy(e.auto.position); v.y = 0;
      v.z += (einzelId ? 2.7 : 3.3);
      v.project(kamera);
      e.el.style.left = ((v.x * 0.5 + 0.5) * canvas.clientWidth) + 'px';
      e.el.style.top = ((-v.y * 0.5 + 0.5) * canvas.clientHeight) + 'px';
    });
    if (dreht) requestAnimationFrame(zeichnen);
  }
  requestAnimationFrame(zeichnen);
  document.getElementById('info').textContent = einzelId
    ? autos[0].name + ' – ' + autos[0].karosserie
    : autos.length + ' Autos · Ansicht ' + grundWinkel + '° · ?auto=<id> für Einzelansicht';
  window.vorschau = { eintraege, renderer, szene, kamera };
})();
</script>
</body>
</html>
