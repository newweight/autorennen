<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18224d">
<title>Spiele</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="gemeinsam/stil.css">
</head>
<body>
<div id="app">
  <div class="bildschirm">
    <div class="kopfzeile"><span></span><span></span></div>
    <h1>🎲 Spiele</h1>
    <p class="unter">Such dir ein Spiel aus!</p>
    <div class="karten" id="karten">
      <a class="karte" href="vier-gewinnt/"><span class="em">🔴</span><b id="t-vier">4 gewinnt</b><small>Vier in einer Reihe</small></a>
      <a class="karte" href="schach/"><span class="em">♟️</span><b id="t-schach">Schach</b><small>Das Spiel der Könige</small></a>
      <a class="karte" href="../"><span class="em">🚗</span><b>Autorennen</b><small>Jonas Hot Steering Wheel</small></a>
    </div>
    <p class="regeln">Alle Spiele gehen zu zweit am selben Gerät, gegen den Computer – und online mit Freunden per Raumcode.</p>
  </div>
</div>
<script src="gemeinsam/konstanten.js"></script>
<script>
  // Farben und Texte kommen zentral aus gemeinsam/konstanten.js
  (function () {
    var K = window.BRETT.K;
    for (var k in K.FARBEN) document.documentElement.style.setProperty('--c-' + k, K.FARBEN[k]);
    document.getElementById('t-vier').textContent = K.TEXTE.vier.titel;
    document.getElementById('t-schach').textContent = K.TEXTE.schach.titel;
  })();
</script>
</body>
</html>
